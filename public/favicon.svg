<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" fill="none">
  <rect width="36" height="36" rx="8" fill="#2563eb"/>
  <!-- Car body (lower) -->
  <rect x="4" y="19" width="28" height="7" rx="2" fill="#fff"/>
  <!-- Car cabin (upper) with rounded roof -->
  <path d="M10 19 C11 14, 14 12, 18 12 C22 12, 25 14, 26 19 Z" fill="#fff"/>
  <!-- Windshield -->
  <path d="M11.5 19 C12 15.5, 14.5 13.5, 18 13.5 C21.5 13.5, 24 15.5, 24.5 19 Z" fill="#2563eb"/>
  <!-- Left wheel -->
  <circle cx="10.5" cy="27.5" r="3" fill="#2563eb" stroke="#fff" stroke-width="1.5"/>
  <circle cx="10.5" cy="27.5" r="1.2" fill="#fff"/>
  <!-- Right wheel -->
  <circle cx="25.5" cy="27.5" r="3" fill="#2563eb" stroke="#fff" stroke-width="1.5"/>
  <circle cx="25.5" cy="27.5" r="1.2" fill="#fff"/>
  <!-- Left headlight (white) -->
  <rect x="4" y="20.5" width="3" height="2" rx="0.5" fill="#fff"/>
  <!-- Right taillight (red) -->
  <rect x="29" y="20.5" width="3" height="2" rx="0.5" fill="#fca5a5"/>
</svg>
