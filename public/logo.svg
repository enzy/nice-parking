<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <rect width="100" height="100" rx="20" fill="#2563eb"/>

  <!-- P badge circle (top right) -->
  <circle cx="78" cy="26" r="16" stroke="#fff" stroke-width="3.5" fill="none"/>
  <!-- P letter built from paths (no font dependency) -->
  <path d="M72 18 L72 34 M72 18 L77 18 C80.5 18 82.5 20 82.5 22.5 C82.5 25 80.5 27 77 27 L72 27"
        stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Car body outline - side view sedan -->
  <!-- Main body: from bumper to bumper -->
  <path d="
    M10 68
    L10 60
    C10 58.5 11 57.5 12.5 57.5
    L18 57.5
    L26 42
    C27.5 39 30.5 37 34 37
    L58 37
    C61 37 63.5 38.5 65 41
    L72 53
    L75 57.5
    L88 57.5
    C89.5 57.5 90.5 58.5 90.5 60
    L90.5 68
    C90.5 69.5 89.5 70.5 88 70.5
    L82 70.5
    C81 65 76 61 70 61
    C64 61 59 65 58 70.5
    L40 70.5
    C39 65 34 61 28 61
    C22 61 17 65 16 70.5
    L12.5 70.5
    C11 70.5 10 69.5 10 68 Z
  " stroke="#fff" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" fill="none"/>

  <!-- Front windshield window -->
  <path d="M57 38.5 L52 53.5 L71 53.5 L65.5 43 C64.5 40.5 62 38.5 59.5 38.5 Z"
        stroke="#fff" stroke-width="3" stroke-linejoin="round" fill="none"/>

  <!-- Rear window -->
  <path d="M35 38.5 L33 38.5 C31 38.5 29.5 39.5 28.5 41.5 L21 53.5 L49 53.5 L50 38.5 Z"
        stroke="#fff" stroke-width="3" stroke-linejoin="round" fill="none"/>

  <!-- Left wheel -->
  <circle cx="28" cy="74" r="11" stroke="#fff" stroke-width="3.5" fill="none"/>
  <circle cx="28" cy="74" r="4" stroke="#fff" stroke-width="2" fill="none"/>

  <!-- Right wheel -->
  <circle cx="70" cy="74" r="11" stroke="#fff" stroke-width="3.5" fill="none"/>
  <circle cx="70" cy="74" r="4" stroke="#fff" stroke-width="2" fill="none"/>
</svg>
